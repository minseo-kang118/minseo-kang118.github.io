<script>
(function(){
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d', {alpha:false});
  // var ramp = "/MK}63G57;#]uRz)Uk81C,M0kHj!5(S-FpX$-W4etY2LwHjaiG,mc#QE5)A}D_=P}{Rcx$YVh0zu=k?ACKEyE)kM_u0SVxi8;/W{6=N+h%fGVU1KBLX.wG/D&wFx6eU3N6e!Z5$pcHR3Wrbw;A?[+JU5rAz6Eze3=F,6v$&nSZ5ix;#aLvjBT}Gir}F4mQBPhyP?T{],.a,n{8RS]TmN0[+C([BcPmM33]n6CrJB{yH{cj}LY?)/0G7w=2/Uce#vz)TN[D7US5-wX}*LT4CxG)B/z[McMyx!;f)BBM=K%nLn";   // more characters: minima ... maxima
  var ramp = "<[{()}]>";
  var RL = ramp.length - 1;
  var koiBody = "oO08@%&#$";    // fixed ramp for fish bodies
  var KBL = koiBody.length - 1;
  var koiFinR = "~^':;-+";      // fixed ramp for fins / tail
  var KFL = koiFinR.length - 1;
  function hsh(n){ n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15); return (n>>>0)/4294967296; }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seed = 0;   // random seed for the letters; reseeds every second

  var W,H,cols,rows,cellW,cellH,fontSize;
  function resize(){
    W = canvas.width  = Math.floor(window.innerWidth);
    H = canvas.height = Math.floor(window.innerHeight);
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    fontSize = window.innerWidth < 600 ? 8 : 10;
    cellW = fontSize * 0.60;
    cellH = fontSize * 1.08;
    cols = Math.ceil(W / cellW) + 1;
    rows = Math.ceil(H / cellH) + 1;
    ctx.font = fontSize + 'px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    ctx.textBaseline = 'top';
  }
  resize();

  // --- three koi: shape masks that recolour the field's own letters ---
  // a1/s1/p1 drive the horizontal wander, a2/s2/p2 the vertical; heading comes
  // from the path's derivative, so each fish turns as it swims.
  function krnd(a,b){ return a + Math.random()*(b-a); }
  function mkKoi(c, L){
    return {
      x:-1, y:-1,                       // placed on first frame
      ang: krnd(0, 6.283),              // random initial heading
      sp:  krnd(34, 78),                // px per time unit
      tsp: krnd(34, 78),
      turn: 0, tturn: krnd(-0.8, 0.8),  // current / target turn rate (rad per time unit)
      tmr: krnd(0.5, 3.0),              // countdown to the next change of mind
      L:L, sw:krnd(1.2,2.0), sd:krnd(0.17,0.35), pd:krnd(0,6.28), ph:0,
      hue:c.hue, sat:c.sat, lit:c.lit, phue:c.phue, psat:c.psat, plit:c.plit
    };
  }
  var kois = [
    mkKoi({hue:26, sat:92, lit:58, phue:6,   psat:88, plit:48}, 56),  // orange / deep red
    mkKoi({hue:40, sat:10, lit:86, phue:355, psat:85, plit:56}, 48),  // white / red (kohaku)
    mkKoi({hue:47, sat:88, lit:64, phue:30,  psat:30, plit:34}, 40)   // gold / charcoal
  ];
  var kLastT = null, kNow = 0;
  var kst = [];
  function koiState(t){
    var dt = (kLastT === null) ? 0 : (t - kLastT);
    if(dt < 0 || dt > 1) dt = 0;
    kLastT = t;
    kNow = t;
    for(var k=0;k<kois.length;k++){
      var o = kois[k];
      if(o.x < 0){ o.x = krnd(0.15,0.85)*W; o.y = krnd(0.15,0.85)*H; }
      // --- wander: the turn rate itself random-walks, so the route never repeats
      o.tmr -= dt;
      if(o.tmr <= 0){
        o.tturn = krnd(-1.35, 1.35);
        o.tsp   = krnd(28, 88);
        o.tmr   = krnd(0.6, 3.2);
      }
      var ease = dt*1.8; if(ease > 1) ease = 1;
      o.turn += (o.tturn - o.turn)*ease;
      o.sp   += (o.tsp   - o.sp  )*ease*0.6;
      // --- steer away from the edges, gently, before they reach them
      var mx = W*0.12, my = H*0.12, steer = 0;
      if(o.x < mx)      steer = (mx - o.x)/mx;
      else if(o.x > W-mx) steer = -(o.x - (W-mx))/mx;
      var steerY = 0;
      if(o.y < my)      steerY = (my - o.y)/my;
      else if(o.y > H-my) steerY = -(o.y - (H-my))/my;
      if(steer || steerY){
        var want = Math.atan2(steerY ? steerY : Math.sin(o.ang), steer ? steer : Math.cos(o.ang));
        var d = want - o.ang;
        while(d >  Math.PI) d -= 6.283185;
        while(d < -Math.PI) d += 6.283185;
        var urg = Math.max(Math.abs(steer), Math.abs(steerY));
        o.turn += d * Math.min(1, urg*urg*3.2) * Math.min(1, dt*4);
      }
      if(o.turn < -2.2) o.turn = -2.2; else if(o.turn > 2.2) o.turn = 2.2;
      o.ang += o.turn*dt;
      o.x   += Math.cos(o.ang)*o.sp*dt;
      o.y   += Math.sin(o.ang)*o.sp*dt;
      if(o.x < -60) o.x = -60; else if(o.x > W+60) o.x = W+60;
      if(o.y < -60) o.y = -60; else if(o.y > H+60) o.y = H+60;
      // depth: slow rise and sink, so the fish reads as nearer or further away
      var dep = Math.sin(t*o.sd + o.pd);
      var Ls = o.L * (1 + 0.20*dep);
      // body axis runs nose -> tail, so it points OPPOSITE the direction of travel
      var ang = o.ang + Math.PI;
      var curv = o.sp > 1 ? o.turn / o.sp : 0;      // rad per px
      var bend = -curv * Ls * 1.6;
      if(bend < -0.55) bend = -0.55; else if(bend > 0.55) bend = 0.55;
      // tail beats faster when the fish is actually moving faster
      var sn = o.sp / 88; if(sn > 1) sn = 1;
      o.ph += dt * (1.1 + 6.2*sn) * o.sw;
      var R = Ls*2.1;
      kst[k] = {cx:o.x, cy:o.y, ca:Math.cos(ang), sa:Math.sin(ang), L:Ls, R2:R*R,
                swim:o.ph, bend:bend, dep:dep, o:o};
    }
  }
  // returns 0 outside, 1 body, 0.55 fin  (u = along body, yy = lateral)
  function koiHit(s, dx, dy, inf){
    var u  = ( dx*s.ca + dy*s.sa) / s.L;
    var v  = (-dx*s.sa + dy*s.ca) / s.L;
    if(u < -1.15-inf || u > 1.85+inf) return 0;
    // spine: swimming undulation + arc into the current turn
    var amp = 0.13 * (0.30 + 0.70*Math.max(0,(u+1)/2.6));
    var yy = v - amp*Math.sin(3.0*u - s.swim) - s.bend*(0.5*u*u + 0.25*u);
    var ay = Math.abs(yy);
    // body: tapered ellipse, fuller at the head
    var hw = 0;
    if(u >= -1-inf && u <= 1+inf){
      var uu = u; if(uu < -1) uu = -1; else if(uu > 1) uu = 1;
      hw = 0.30*Math.sqrt(Math.max(0, 1 - uu*uu))*(1 - 0.34*Math.max(0,uu));
      if(ay <= hw + inf) return 1;
    }
    // caudal fin: flared and forked, trailing behind
    if(u > 0.92 && u < 1.85+inf){
      var q = (u - 0.92)/0.93; if(q > 1) q = 1;
      var flare = 0.05 + 0.40*Math.pow(q, 1.25);
      var wave  = 0.05*Math.sin(5.0*u - s.swim*1.15);
      if(ay <= flare + wave + inf){
        if(!(u > 1.30 && ay < 0.30*((u - 1.30)/0.55) - inf)) return 0.55;  // fork notch
      }
    }
    // dorsal fin along the back
    if(u > -0.30 && u < 0.62 && hw > 0 && yy < 0){
      var dh = 0.15*Math.sin((u + 0.30)/0.92*Math.PI);
      if(ay > hw && ay <= hw + dh + inf) return 0.55;
    }
    // pectoral fins, both sides
    if(u > -0.62 && u < -0.18){
      var pw = 0.17*Math.sin((u + 0.62)/0.44*Math.PI);
      var bh = 0.30*Math.sqrt(Math.max(0,1 - u*u))*(1 - 0.34*Math.max(0,u));
      if(ay > bh && ay <= bh + pw + inf) return 0.55;
    }
    // barbels at the nose
    if(u < -0.92 && u > -1.15-inf && ay < 0.07 + inf) return 0.55;
    return 0;
  }
  // kohaku-style blotches, fixed to the fish
  function koiPatch(s, dx, dy){
    var u = ( dx*s.ca + dy*s.sa) / s.L;
    var v = (-dx*s.sa + dy*s.ca) / s.L - s.bend*(0.5*u*u + 0.25*u);
    return (Math.sin(u*5.2 + 1.3)*Math.sin(v*8.0 + u*2.4) > 0.12);
  }

  // --- click anywhere outside the text box to add a koi ---
  var koiPalette = [
    {hue:26,  sat:92, lit:58, phue:6,   psat:88, plit:48},   // orange / deep red
    {hue:40,  sat:10, lit:86, phue:355, psat:85, plit:56},   // white / red
    {hue:47,  sat:88, lit:64, phue:30,  psat:30, plit:34},   // gold / charcoal
    {hue:14,  sat:85, lit:54, phue:35,  psat:70, plit:72},   // red / cream
    {hue:200, sat:55, lit:62, phue:215, psat:60, plit:36},   // blue-gray / slate
    {hue:52,  sat:70, lit:72, phue:20,  psat:80, plit:50}    // butter / amber
  ];
  var MAX_KOI = 14;
  function addKoi(fx, fy){
    if(kois.length >= MAX_KOI) kois.shift();      // oldest swims off
    var c = koiPalette[(Math.random()*koiPalette.length)|0];
    var o = mkKoi(c, krnd(34, 58));
    o.x = Math.min(W-20, Math.max(20, fx*W));     // starts exactly where you clicked
    o.y = Math.min(H-20, Math.max(20, fy*H));
    kois.push(o);
  }
  document.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('main')) return;   // not inside the text box
    addKoi(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
  });

  function draw(t){
    koiState(t);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    var lastColor = '';
    for(var j=0;j<rows;j++){
      var y = j * cellH;
      for(var i=0;i<cols;i++){
        // organic flow via domain warping -> natural, non-grid motion
        var wx = i*0.060 + 1.4*Math.sin(j*0.040 + t*0.35) + 0.55*Math.sin(j*0.105 - t*0.62);
        var wy = j*0.068 + 1.4*Math.sin(i*0.048 - t*0.30) + 0.55*Math.sin(i*0.125 + t*0.52);
        var f = Math.sin(wx + t*0.50)
              + Math.sin(wy - t*0.40)
              + Math.sin((wx + wy)*0.6 + t*0.22);
        var b = 0.5 + f/6; if(b<0)b=0; else if(b>1)b=1;   // brightness
        // hue from a slower warped field so colour drifts in broad bands
        var cf = Math.sin(wx*0.5 - t*0.18) + Math.sin(wy*0.5 + t*0.15);
        var hue = (((cf*90 + t*18) % 360) + 360) % 360;
        hue = (hue / 3 | 0) * 3;
        var light = (22 + b*46) | 0;                      // 22..68 -> never black
        // koi: same field letters, different colour where a fish's body is
        var px = i*cellW, hit = 0, ko = null, ks = null;
        for(var k=0;k<kst.length;k++){
          var st = kst[k];
          var ddx = px - st.cx, ddy = y - st.cy;
          if(ddx*ddx + ddy*ddy > st.R2) continue;
          var h = koiHit(st, ddx, ddy, 0);
          if(h){ hit = h; ks = st; ko = st.o; break; }
          if(koiHit(st, ddx, ddy, 0.055)){ hit = 0.2; ks = st; ko = st.o; break; }  // outline
        }
        var color;
        if(hit === 0.2){
          color = 'hsl(0,0%,7%)';                                 // dark halo
        } else if(hit){
          var patch = (hit === 1) && koiPatch(ks, px - ks.cx, y - ks.cy);
          var kh = patch ? ko.phue : ko.hue;
          var ksa = patch ? ko.psat : ko.sat;
          var kl = (patch ? ko.plit : ko.lit) + (b - 0.5)*8 + ks.dep*7;   // deeper = dimmer
          if(hit < 1) kl -= 8;                                     // fins a touch deeper
          if(kl < 10) kl = 10; else if(kl > 94) kl = 94;
          color = 'hsl(' + kh + ',' + ksa + '%,' + (kl|0) + '%)';
        } else {
          color = 'hsl(' + hue + ',70%,' + light + '%)';
        }
        if(color !== lastColor){ ctx.fillStyle = color; lastColor = color; }
        // character: koi parts use their own fixed ramps, field uses its own
        var chr;
        if(hit === 1)        chr = koiBody.charAt((b*KBL + 0.5) | 0);
        else if(hit === 0.55) chr = koiFinR.charAt((b*KFL + 0.5) | 0);
        else                  chr = ramp.charAt((b*RL + 0.5) | 0);
        ctx.fillText(chr, px, y);
      }
    }
  }

  if(reduce){
    draw(0.6);
  } else {
    var t = 0, last = 0, running = true;
    function loop(now){
      if(!running) return;
      requestAnimationFrame(loop);
      if(now - last < 40) return;             // ~30 fps -> smooth glide
      last = now;
      t += 0.02;                              // small step per frame -> no jumps
      seed = (now / 1000) | 0;                // reseed once per second, not per frame
      draw(t);
    }
    requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', function(){
      running = !document.hidden;
      if(running) requestAnimationFrame(loop);
    });
  }

  var rz;
  window.addEventListener('resize', function(){
    clearTimeout(rz);
    rz = setTimeout(function(){ resize(); if(reduce) draw(0.6); }, 150);
  });
})();

/* email: assembled here so scrapers don't find it in the HTML, copied on click */
(function(){
  var btn = document.getElementById('mail');
  if(!btn) return;
  var user = ['minseo','kang'].join('.');
  var host = ['u','nus','edu'].join('.');
  var addr = user + String.fromCharCode(64) + host;
  btn.title = 'Click to copy';
  var reset;
  function done(ok){
    btn.textContent = ok ? 'Copied \u2713' : addr;
    btn.classList.toggle('copied', ok);
    clearTimeout(reset);
    reset = setTimeout(function(){ btn.textContent = 'Email'; btn.classList.remove('copied'); }, ok ? 1600 : 6000);
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();                       // don't also spawn a koi
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(addr).then(function(){ done(true); }, function(){ fallback(); });
    } else { fallback(); }
  });
  function fallback(){
    try{
      var ta = document.createElement('textarea');
      ta.value = addr; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-9999px';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    }catch(err){ done(false); }   // last resort: show the address to copy by hand
  }
})();

/* city name decode animation */
(function(){
  var el = document.getElementById('city');
  if(!el) return;
  var cities = ['Seoul','New York','the UK', 'Washington, D.C.'];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ var r=0; setInterval(function(){ r=(r+1)%cities.length; el.textContent=cities[r]; }, 2800); return; }
  var pool = '!<>-_/[]{}=+*^?#$%&abcdefghijklmnopqrstuvwxyz';
  function rnd(){ return pool[Math.floor(Math.random()*pool.length)]; }
  function Scramble(node){ this.node=node; this.frame=0; this.queue=[]; this.req=null; }
  Scramble.prototype.set=function(newText){
    var self=this, oldText=this.node.textContent, len=Math.max(oldText.length,newText.length);
    this.queue=[];
    for(var i=0;i<len;i++){
      var from=oldText[i]||'', to=newText[i]||'';
      var start=Math.floor(Math.random()*24), end=start+Math.floor(Math.random()*24)+10;
      this.queue.push({from:from,to:to,start:start,end:end,ch:''});
    }
    cancelAnimationFrame(this.req); this.frame=0;
    return new Promise(function(res){ self.resolve=res; self.update(); });
  };
  Scramble.prototype.update=function(){
    var out='', done=0;
    for(var i=0;i<this.queue.length;i++){
      var q=this.queue[i];
      if(this.frame>=q.end){ done++; out+=q.to; }
      else if(this.frame>=q.start){ if(!q.ch||Math.random()<0.28){ q.ch=rnd(); } out+='<span class="dud">'+q.ch+'</span>'; }
      else { out+=q.from; }
    }
    this.node.innerHTML=out;
    if(done===this.queue.length){ this.resolve(); }
    else { this.frame++; this.req=requestAnimationFrame(this.update.bind(this)); }
  };
  var fx=new Scramble(el), i=0, HOLD=2200;
  function cycle(){ i=(i+1)%cities.length; fx.set(cities[i]).then(function(){ setTimeout(cycle, HOLD); }); }
  setTimeout(cycle, HOLD);
})();
</script>
</body>
